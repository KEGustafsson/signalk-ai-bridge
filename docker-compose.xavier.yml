# Ollama on an NVIDIA Jetson Xavier NX, with CUDA enabled.
#
# Xavier NX is the previous generation: a Volta GPU (SM 7.2) rather than Orin's
# Ampere (SM 8.7), and 8 GB of LPDDR4x at 59.7 GB/s against Orin Nano Super's
# 102 GB/s LPDDR5. Token generation is memory-bandwidth bound, so expect roughly
# 55-65% of the Orin Nano Super's tokens per second on the same model. The
# plugin's GPU tuning matters more here, not less: the same 8 GB budget with
# less bandwidth to make up for a CPU spill.
#
# Xavier is supported up to JetPack 5.x (L4T 35.x). JetPack 6 dropped Xavier,
# which is why this file exists separately from docker-compose.nano-super.yml —
# that one declares JETSON_JETPACK=6.
#
# The board this file is written for runs a headless Yocto/meta-tegra image
# rather than the JetPack Ubuntu desktop. That is not cosmetic: it is what
# leaves ~6 GB of the 8 GB free for Ollama instead of ~3, and therefore what
# decides which model this file can pull. See the MODEL comment below.
#
# TensorRT-LLM is NOT available on this board. It requires compute capability
# 8.0 or newer and Xavier is 7.2, so docker-compose.tensorrt.yml and
# scripts/build-trtllm-engine.sh do not apply. Ollama is the whole story here.
# The plugin's GPU Acceleration card says so directly if the backend is set to
# tensorrt-llm on a pre-Ampere board, rather than reporting it unreachable.
#
# That is not a compromise: Ollama does run native CUDA on this GPU. The arm64
# `ollama/ollama` image ships a `cuda_jetpack5` runner built with
# CMAKE_CUDA_ARCHITECTURES "72;87", so there is real sm_72 SASS for Volta - not
# PTX JIT, and not a CPU fallback. Ollama selects it two ways, and both are set
# below: JETSON_JETPACK=5, and the /etc/nv_tegra_release mount, from which it
# reads L4T R35 and maps that to jetpack5. Confirm which runner it chose with
# `docker logs ollama | grep -i runner`.
#
# Requirements on the host:
#   - An L4T 35.x userspace with nvidia-container-runtime available to Docker.
#     On a JetPack image that is `apt-get install nvidia-container-toolkit`; on
#     meta-tegra it is whatever the image already builds in.
#   - /etc/nv_tegra_release present, since the mount below is one of the two
#     ways Ollama picks the cuda_jetpack5 runner. meta-tegra normally generates
#     it; if it is missing, Docker silently creates a directory at that path in
#     the container and only JETSON_JETPACK=5 is left to select the runner —
#     which is why both are set. Check with `docker logs ollama | grep -i runner`.
#   - `sudo nvpmodel -m <id> && sudo jetson_clocks` for the top power mode; the
#     plugin's GPU Acceleration card names the id (Xavier NX has no MAXN mode,
#     so the highest wattage/core count wins — usually MODE_20W_6CORE). A Yocto
#     image may ship neither tool nor /etc/nvpmodel.conf; the telemetry treats
#     those files as absent rather than failing, so the card simply omits the
#     power-mode row there.
#     Worth knowing why that one: on a Xavier NX every mode caps the GPU at the
#     same 1109 MHz and gates the same TPC, so the mode does not buy GPU clock.
#     What the three 20 W modes alone buy is EMC at 1866 MHz instead of 1600,
#     and token generation is memory-bandwidth bound — so the memory controller
#     is the reason to be in a 20 W mode, not the shader clock.
#
# Start it with:
#   docker compose -f docker-compose.xavier.yml up -d

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    init: true
    # Long enough for the server to flush and exit cleanly after SIGTERM.
    stop_grace_period: 30s
    runtime: nvidia
    ports:
      # Loopback only. Docker publishes to 0.0.0.0 by default AND bypasses
      # the host firewall, which would put an unauthenticated Ollama API -
      # including POST /api/pull and DELETE /api/delete - on the boat's LAN
      # and any marina wifi it is bridged to. Signal K runs on this host, so
      # loopback is all the plugin needs; use a shared Docker network to
      # reach it from another container.
      - "127.0.0.1:11434:11434"
      # Signal K on ANOTHER machine? Publish on this host's LAN address
      # instead - the interface bind is the scoping tool here, because Docker
      # bypasses the host firewall for published ports. Anyone who can reach
      # the port can run inference, pull models and delete them, so bind the
      # one interface the Signal K host is on, never "11434:11434" (all
      # interfaces) on a machine that ever bridges to untrusted wifi:
      #   - "192.168.1.10:11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
      - /etc/nv_tegra_release:/etc/nv_tegra_release:ro
    environment:
      - JETSON_JETPACK=5
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Volta is the generation that introduced tensor cores, and llama.cpp uses
      # them here: ggml-cuda/fattn.cu carries an explicit `cc == VOLTA` branch
      # that dispatches to the MMA f16 kernels with Volta-specific tuning, and
      # falls back to the tile kernel only for small batches. This is not a
      # degraded path, it is a tuned one.
      #
      # Leave it on. Ollama only honours OLLAMA_KV_CACHE_TYPE when flash
      # attention is enabled, so turning it off silently doubles the KV cache
      # back to f16 — on the board with the least memory bandwidth to spare,
      # that is what pushes layers back onto the Carmel cores.
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_SCHED_SPREAD=0
      - OLLAMA_GPU_OVERHEAD=536870912
    deploy:
      resources:
        limits:
          # 6 Carmel cores. Raise `memory` to ~14G on the 16 GB Xavier NX module.
          cpus: '6.0'
          memory: 7G
        reservations:
          memory: 2G
          # No `devices:` block here. Compose turns that into a --gpus device
          # request, which on L4T needs CDI specs that `apt-get install
          # nvidia-container-toolkit` - what the README and this header tell you
          # to run - does not generate; the container then refuses to start with
          # 'could not select device driver "nvidia" with capabilities: [[gpu]]'.
          # Tegra is the exception where `runtime: nvidia` above is the supported
          # form. Add the device request back only if you have also run
          # `sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml`.
    entrypoint: /bin/sh
    # List form with a block scalar, NOT a single quoted string. Compose
    # word-splits a string command shell-style, and the inner double quotes of
    # `echo "model pull attempt $n failed"` closed the outer argument: the
    # script handed to `sh -c` was truncated mid-`until` loop, so every start
    # died with `Syntax error: end of file unexpected (expecting "done")` and
    # the container restart-looped. Nothing is split here, so the quoting inside
    # is the shell's business alone.
    #
    # `$$` is Compose's escape for a literal `$`.
    command:
      - "-c"
      - |
        ollama serve &
        srv=$$!
        trap 'kill -TERM $$srv 2>/dev/null' TERM INT

        # Poll until the server accepts requests rather than sleeping a fixed
        # interval: a slower start-up made `ollama pull` fail, which took the
        # shell down through the && chain and restart-looped the container.
        tries=0
        until ollama list >/dev/null 2>&1 || [ $$tries -ge 60 ]; do
          tries=$$((tries + 1))
          sleep 1
        done

        # Ask about THIS model, not "is any model installed". Two ways to get
        # that wrong, both of which shipped: `ollama list | grep -q .` matched
        # the NAME/ID/SIZE/MODIFIED header on an empty store, so the pull never
        # ran at all; and testing for any entry meant a box that already held a
        # different model - anyone upgrading from an earlier compose file - kept
        # that one and never fetched the configured one. `ollama show` answers
        # the exact question with an exit status, so neither trap applies.
        MODEL=gemma4:e2b-it-qat

        have_model() {
          ollama show "$$MODEL" >/dev/null 2>&1
        }

        # The same model the Orin file pulls, and it fits here for a reason
        # worth stating: this board runs a headless Yocto/meta-tegra image, not
        # the JetPack desktop. Idle RAM is a few hundred MB rather than the
        # 2.5-3 GB a GNOME session costs, so roughly 6 GB of the 8 GB is free
        # for Ollama after Signal K - room for 4.3 GB of weights, the KV cache,
        # and the 512 MB reserved above, with about a gigabyte spare.
        #
        # Only the plain gemma4:e2b tag is out of reach. That one is 7.2 GB and
        # was measured here at 6.4 GiB resident, 3.4% on the GPU and 96.6% on
        # the Carmel cores, nearly eight minutes for a two-token answer. No
        # context window is small enough to fix that: it is the weights that do
        # not fit. Pull the -it-qat build, never the bare tag.
        #
        # Expect roughly 55-65% of the Orin Nano Super's tokens per second on
        # the same model - about 14-16 against its 25. That is the LPDDR4x
        # bandwidth, not the model choice, and it is the whole difference
        # between these two files' hardware.
        #
        # If this board is ever reflashed to a JetPack desktop image, that 6 GB
        # becomes about 3 and this tag stops fitting. The fallback then is
        # qwen3.5:2b-q4_K_M (1.9 GB), and qwen3.5:0.8b (1.0 GB) below it.
        #
        # Quantization format matters as much as size on Volta. sm_72 has no
        # bf16 and no FP4 hardware, so the -bf16 and -nvfp4 tags in the same
        # libraries are a larger download for a slower path. Q4_K_M and QAT q4_0
        # GGUF are the formats this GPU actually executes.
        #
        # A failed pull is non-fatal - any model already cached still serves.
        n=0
        until have_model || [ $$n -ge 3 ]; do
          n=$$((n + 1))
          ollama pull "$$MODEL" && break
          echo "model pull attempt $$n failed; retrying"
          sleep $$((n * 10))
        done

        have_model ||
          echo "$$MODEL is not installed; point the plugin at a model that is"

        wait $$srv
    healthcheck:
      test: ["CMD-SHELL", "ollama ps > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
