# Ollama on an NVIDIA Jetson Xavier NX, with CUDA enabled.
#
# Xavier NX is the previous generation: a Volta GPU (SM 7.2) rather than Orin's
# Ampere (SM 8.7), and 8 GB of LPDDR4x at 59.7 GB/s against Orin Nano Super's
# 102 GB/s LPDDR5. Token generation is memory-bandwidth bound, so expect roughly
# 55-65% of the Orin Nano Super's tokens per second on the same model. The
# plugin's GPU tuning matters more here, not less: the same 8 GB budget with
# less bandwidth to make up for a CPU spill.
#
# Xavier is supported up to JetPack 5.x (L4T 35.x, Ubuntu 20.04). JetPack 6
# dropped Xavier, which is why this file exists separately from
# docker-compose.jetson.yml — that one declares JETSON_JETPACK=6.
#
# TensorRT-LLM is NOT available on this board. It requires compute capability
# 8.0 or newer and Xavier is 7.2, so docker-compose.tensorrt.yml and
# scripts/build-trtllm-engine.sh do not apply. Ollama is the whole story here.
#
# Requirements on the host:
#   - JetPack 5.1.x with nvidia-container-toolkit installed
#   - `sudo nvpmodel -m <id> && sudo jetson_clocks` for the top power mode; the
#     plugin's GPU Acceleration card names the id (Xavier NX has no MAXN mode,
#     so the highest wattage/core count wins — usually MODE_20W_6CORE).
#
# Start it with:
#   docker compose -f docker-compose.xavier.yml up -d

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    init: true
    # Long enough for the server to flush and exit cleanly after SIGTERM.
    stop_grace_period: 30s
    runtime: nvidia
    ports:
      # Loopback only. Docker publishes to 0.0.0.0 by default AND bypasses
      # the host firewall, which would put an unauthenticated Ollama API -
      # including POST /api/pull and DELETE /api/delete - on the boat's LAN
      # and any marina wifi it is bridged to. Signal K runs on this host, so
      # loopback is all the plugin needs; use a shared Docker network to
      # reach it from another container.
      - "127.0.0.1:11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
      - /etc/nv_tegra_release:/etc/nv_tegra_release:ro
    environment:
      - JETSON_JETPACK=5
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Volta supports flash attention in llama.cpp, but without the Ampere
      # tensor-core path it buys less than it does on Orin. It is still required
      # for KV cache quantization below, which is the bigger win on 8 GB.
      # Drop both if you see instability on this generation.
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_SCHED_SPREAD=0
      - OLLAMA_GPU_OVERHEAD=536870912
    deploy:
      resources:
        limits:
          # 6 Carmel cores. Raise `memory` to ~14G on the 16 GB Xavier NX module.
          cpus: '6.0'
          memory: 7G
        reservations:
          memory: 2G
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: /bin/sh
    # Poll until the server accepts requests instead of sleeping a fixed
    # interval: a slower start-up made `ollama pull` fail, which took the shell
    # down through the && chain and restart-looped the container. A failed pull
    # is also non-fatal — cached models still serve.
    command: -c "ollama serve & srv=$$!; trap 'kill -TERM $$srv 2>/dev/null' TERM INT; tries=0; until ollama list >/dev/null 2>&1 || [ $$tries -ge 60 ]; do tries=$$((tries+1)); sleep 1; done; n=0; until ollama list 2>/dev/null | grep -q . || [ $$n -ge 3 ]; do n=$$((n+1)); ollama pull gemma4:e2b && break; echo "model pull attempt $$n failed; retrying"; sleep $$((n*10)); done; (ollama list 2>/dev/null | grep -q . || echo 'no model available; serving nothing until one is pulled'); wait $$srv"
    healthcheck:
      test: ["CMD-SHELL", "ollama ps > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
