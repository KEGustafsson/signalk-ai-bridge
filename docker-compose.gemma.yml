# Portable Ollama + Gemma setup that runs anywhere Docker does.
#
# This file deliberately does NOT request a GPU, so it also works on hosts with
# no NVIDIA runtime — which also means inference here runs on the CPU.
#
# On an NVIDIA Jetson Orin Nano Super use docker-compose.jetson.yml instead: it
# enables the NVIDIA container runtime, flash attention and a quantized KV
# cache, which is what keeps the whole model resident on the GPU.

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    environment:
      - OLLAMA_DEBUG=1
      # Keep the model loaded between operator questions. Harmless on CPU and
      # a large latency win on any accelerated host.
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 16G
        reservations:
          memory: 2G
    entrypoint: /bin/sh
    # Poll until the server accepts requests instead of sleeping a fixed
    # interval: a slower Jetson start-up made `ollama pull` fail, which took
    # the shell down through the && chain and restart-looped the container.
    # A failed pull is also non-fatal now — cached models still serve.
    command: -c "ollama serve & tries=0; until ollama list >/dev/null 2>&1 || [ $$tries -ge 60 ]; do tries=$$((tries+1)); sleep 1; done; ollama pull gemma4:e2b || echo 'model pull failed; serving whatever is already cached'; wait"
