# Portable Ollama + Gemma setup that runs anywhere Docker does.
#
# This file deliberately does NOT request a GPU, so it also works on hosts with
# no NVIDIA runtime — which also means inference here runs on the CPU.
#
# On an NVIDIA Jetson Orin Nano Super use docker-compose.nano-super.yml instead:
# it enables the NVIDIA container runtime, flash attention and a quantized KV
# cache, which is what keeps the whole model resident on the GPU.

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    init: true
    # Long enough for the server to flush and exit cleanly after SIGTERM.
    stop_grace_period: 30s
    ports:
      # Published on all interfaces by default so a Signal K server on
      # another machine works out of the box. Ollama has no authentication -
      # anyone who can reach the port can run inference, pull models and
      # delete them - and Docker bypasses the host firewall for published
      # ports, so the bind address is the scoping tool. On a boat that
      # bridges to marina or other untrusted wifi, narrow it without editing
      # this file by setting OLLAMA_BIND (in the shell or a .env beside this
      # file) to this host's LAN address, or to 127.0.0.1 when Signal K runs
      # on this host only:
      #   OLLAMA_BIND=192.168.1.10 docker compose -f <this file> up -d
      - "${OLLAMA_BIND:-0.0.0.0}:11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    environment:
      - OLLAMA_DEBUG=1
      # Keep the model loaded between operator questions. Harmless on CPU and
      # a large latency win on any accelerated host.
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
    deploy:
      resources:
        limits:
          cpus: '4.0'
          # The Jetson files use 7G; this file is the "any host" one, and a
          # limit above the host's RAM never engages - Ollama simply grows
          # until the kernel OOM-killer picks a victim, usually Signal K.
          memory: 6G
        reservations:
          memory: 2G
    entrypoint: /bin/sh
    # List form with a block scalar, NOT a single quoted string. Compose
    # word-splits a string command shell-style, and the inner double quotes of
    # `echo "model pull attempt $n failed"` closed the outer argument: the
    # script handed to `sh -c` was truncated mid-`until` loop, so every start
    # died with `Syntax error: end of file unexpected (expecting "done")` and
    # the container restart-looped. Nothing is split here, so the quoting inside
    # is the shell's business alone.
    #
    # `$$` is Compose's escape for a literal `$`.
    command:
      - "-c"
      - |
        ollama serve &
        srv=$$!
        trap 'kill -TERM $$srv 2>/dev/null' TERM INT

        # Poll until the server accepts requests rather than sleeping a fixed
        # interval: a slower start-up made `ollama pull` fail, which took the
        # shell down through the && chain and restart-looped the container.
        tries=0
        until ollama list >/dev/null 2>&1 || [ $$tries -ge 60 ]; do
          tries=$$((tries + 1))
          sleep 1
        done

        # Ask about THIS model, not "is any model installed". Two ways to get
        # that wrong, both of which shipped: `ollama list | grep -q .` matched
        # the NAME/ID/SIZE/MODIFIED header on an empty store, so the pull never
        # ran at all; and testing for any entry meant a box that already held a
        # different model - anyone upgrading from an earlier compose file - kept
        # that one and never fetched the configured one. `ollama show` answers
        # the exact question with an exit status, so neither trap applies.
        #
        # The quantization-aware-trained build: 4.3 GB against 7.2 GB for the
        # plain gemma4:e2b tag, at close to the same answer quality. On the CPU
        # path that is less memory to stream per token on every generation step,
        # and it is what lets the same model also fit an 8 GB Jetson.
        MODEL=gemma4:e2b-it-qat

        have_model() {
          ollama show "$$MODEL" >/dev/null 2>&1
        }

        # A failed pull is non-fatal - any model already cached still serves.
        n=0
        until have_model || [ $$n -ge 3 ]; do
          n=$$((n + 1))
          ollama pull "$$MODEL" && break
          echo "model pull attempt $$n failed; retrying"
          sleep $$((n * 10))
        done

        have_model ||
          echo "$$MODEL is not installed; point the plugin at a model that is"

        wait $$srv
    healthcheck:
      test: ["CMD-SHELL", "ollama ps > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
